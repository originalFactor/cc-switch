name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - "components.json"
      - "src-tauri/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - "components.json"
      - "src-tauri/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} (frontend + backend)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml is the only source of the compiler version: install it
      # directly instead of letting rustup swap it after stable is installed.
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      # Tauri's linker deps only. On Windows the MSVC build tools ship on the runner.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        id: pnpm-store-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Rust dependencies
        # Restore-only here: the release workflow saves the complete cache under
        # the same key. Saving the CI job's half-built target would shrink it.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: backend
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saved here so the release workflow and other CI runs restore this exact
      # store instead of re-downloading the whole dependency graph.
      - name: Save pnpm store to cache
        if: steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

      # The backend build embeds dist/index.html at compile time; the Vite output
      # is what gets embedded, so re-serve a cached build instead of rebuilding.
      - name: Cache frontend dist
        id: dist-cache
        uses: actions/cache@v5
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles('src/**', 'tests/**', 'index.html', 'vite.config.ts', 'tailwind.config.cjs', 'postcss.config.cjs', 'package.json') }}
          restore-keys: ${{ runner.os }}-dist-

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build frontend
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build:renderer

      # Saved here so the release workflow restores this exact Vite output and the
      # backend build embeds it. Miss on cache-hit means nothing to re-save.
      - name: Save frontend dist to cache
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dist
          key: ${{ steps.dist-cache.outputs.cache-primary-key }}

      # dist is platform-independent: upload it once from the Linux leg only, as
      # a downloadable artifact and a handoff to the release workflow.
      - name: Upload frontend dist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30
          if-no-files-found: error

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci

      # Unsigned installers for manual QA: no signing key, no updater artifacts.
      # The signed installers are produced by the release workflow. A conf
      # override turns off createUpdaterArtifacts so the missing private key
      # does not abort the build.
      - name: Build and bundle Tauri App
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "const c=require('./src-tauri/tauri.conf.json');c.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync('src-tauri/tauri.ci.conf.json',JSON.stringify(c,null,2))"
          pnpm tauri build --bundles msi --config src-tauri/tauri.ci.conf.json
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Recurse -Include *.msi -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI found after bundling'
          }
          New-Item -ItemType Directory -Force -Path ci-assets | Out-Null
          Copy-Item $msi.FullName "ci-assets/CC-Switch-Windows-x86_64.msi"

      - name: Build and bundle Tauri App
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          node -e "const c=require('./src-tauri/tauri.conf.json');c.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync('src-tauri/tauri.ci.conf.json',JSON.stringify(c,null,2))"
          pnpm tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.ci.conf.json
          mkdir -p ci-assets
          appimage=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          deb=$(find src-tauri/target/release/bundle -name "*.deb" | head -1)
          rpm=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1)
          [ -n "$appimage" ] || { echo "No AppImage" >&2; exit 1; }
          [ -n "$deb" ] || { echo "No .deb" >&2; exit 1; }
          [ -n "$rpm" ] || { echo "No .rpm" >&2; exit 1; }
          cp "$appimage" ci-assets/CC-Switch-Linux-x86_64.AppImage
          cp "$deb" ci-assets/CC-Switch-Linux-x86_64.deb
          cp "$rpm" ci-assets/CC-Switch-Linux-x86_64.rpm

      - name: Upload CI installers
        uses: actions/upload-artifact@v4
        with:
          name: ci-installers-${{ runner.os }}
          path: ci-assets/*
          retention-days: 30
          if-no-files-found: error

